<!DOCTYPE html>
<html lang="pt-br">
<head>
  <title>Formulário HTML</title> <!--1 acertei-->
  <meta charset="UTF-8">
</head>  <!--2 acertei-->

<body>
  <h1>Cadastro de Usuário</h1>  <!--3 acertei-->
  <form action="cadastro.php" method="post"> <!--4 acertei-->
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome"> <!--5 acertei-->
    <br>
    
    <label for="email">E-mail:</label> <!--6 acertei-->
    <input type="email" id="email" name="email">
    <br>
    
    <label for="senha">Senha:</label>
    <input type="password" id="senha" name="senha"> <!--7 acertei-->
    <br>
    
    <label for="idade">Idade:</label>
    <input type="number" id="idade" name="idade">
    <br>
    
    <label for="nascimento">Data de nascimento:</label> <!--8 errei-->
    <input type="date" id="nascimento" name="nascimento"> <!--9 errei-->
    <br>
    
    <p>Turno:</p>
    <input type="radio" name="turno" id="manha">
    <label for="manha">Manhã</label>
    
    <input type="radio" name="turno" id="tarde">  <!--10 errei-->
    <label for="tarde">Tarde</label>  <!--11 errei-->
    
    <input type="radio" name="turno" id="noite">
    <label for="noite">Noite</label>
    <br>
    
    <p>Áreas de interesse:</p>
    <input type="checkbox" name="area" id="programacao"> <!--12 errei-->
    <label for="programacao">Programação</label>
    
    <input type="checkbox" name="area" id="design">
    <label for="design">Design</label>
    
    <input type="checkbox" name="area" id="redes">
    <label for="redes">Redes</label>
    <br>
    
    <input type="submit" value="Enviar"> <!--13 errei-->
    <input type="reset" value="Limpar"> <!--14 errei-->
  </form>
</body>
</html>
